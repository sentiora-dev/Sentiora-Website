<!-- Under construction, with a way past it.

     This is a curtain, not a door, and it is important that nobody mistakes
     it for one. The site is static: every word of every page is already in
     the file the browser downloaded, so anyone who wants to read it can, with
     or without the password. What this does is stop a casual visitor landing
     on an unfinished page and thinking that is the finished thing.

     The part that is real protection against the actual risk -- Google
     indexing an unfinished site and keeping it in results for months -- is the
     robots meta tag added alongside this, and that one works properly.

     Switched from `in_constructie` in produse.json, so it comes off everywhere
     at once on the day it should. -->
<div class="under-build" data-under-build hidden role="dialog" aria-modal="true"
     aria-labelledby="under-build-title">
  <div class="under-build-inner">
    <svg class="under-build-mark" viewBox="0 0 64 58" role="img"
         aria-label="Warning" focusable="false">
      <path d="M32 3.5 61 54H3z" fill="none" stroke="#f5c518" stroke-width="5"
            stroke-linejoin="round"/>
      <path d="M32 22v13" stroke="#f5c518" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="44" r="3.1" fill="#f5c518"/>
    </svg>

    <p class="under-build-title" id="under-build-title">Under construction</p>
    <p>Sentiora is being built. Nothing here is finished, prices are not set,
       and no product can be downloaded yet.</p>

    <form class="under-build-form" data-under-build-form>
      <label class="under-build-field">
        <span>Password</span>
        <input type="password" autocomplete="off" spellcheck="false"
               data-under-build-input>
      </label>
      <button type="submit">Let me look</button>
    </form>

    <p class="under-build-said" data-under-build-said role="status"></p>
    <p class="under-build-foot">Come back soon &mdash; or write to
       <a href="mailto:contact@sentiora.dev">contact@sentiora.dev</a>.</p>
  </div>
</div>

<style>
  /* The gate hides everything under it, and hides itself until the script has
     decided. Without that, closing the tab quickly would flash the whole site
     at somebody for the half-second before JavaScript ran. */
  html:has([data-under-build]:not([hidden])) { overflow: hidden; }

  .under-build {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: grid;
    padding: 2rem 1.25rem;
    overflow-y: auto;
    background: #101014;
    place-items: center;
  }

  .under-build[hidden] { display: none; }

  .under-build-inner {
    width: min(100%, 30rem);
    color: #f5f5f0;
    font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    text-align: center;
  }

  .under-build-mark { width: min(7.5rem, 34vw); height: auto; margin-bottom: 1.75rem; }

  .under-build-title {
    margin: 0 0 0.9rem;
    font-size: clamp(1.7rem, 6vw, 2.4rem);
    font-weight: 500;
    letter-spacing: -0.03em;
  }

  .under-build p {
    margin: 0 0 1.6rem;
    color: #c4c4bd;
    font-size: 0.98rem;
    line-height: 1.65;
  }

  .under-build-form {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    margin-bottom: 1rem;
  }

  .under-build-field { display: grid; gap: 0.35rem; flex: 1 1 12rem; text-align: left; }

  .under-build-field span {
    color: #80807a;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .under-build input {
    width: 100%;
    padding: 0.7rem 0.75rem;
    color: #f5f5f0;
    border: 1px solid rgba(245, 245, 240, 0.2);
    border-radius: 0.45rem;
    background: #191920;
    font: inherit;
    font-size: 0.95rem;
  }

  .under-build input:focus { outline: 2px solid #f5c518; outline-offset: 1px; }

  .under-build button {
    align-self: end;
    padding: 0.72rem 1.1rem;
    color: #101014;
    border: 0;
    border-radius: 0.45rem;
    background: #f5c518;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .under-build button:hover { filter: brightness(1.08); }

  .under-build-said { min-height: 1.3rem; margin: 0; color: #f08a8c; font-size: 0.88rem; }
  .under-build-foot { margin: 1.4rem 0 0; color: #80807a; font-size: 0.84rem; }
  .under-build-foot a { color: #f5c518; }

  @media (prefers-reduced-motion: no-preference) {
    .under-build-inner { animation: under-build-in 260ms ease-out; }
    @keyframes under-build-in { from { opacity: 0; transform: translateY(0.5rem); } }
  }
</style>

<script>
  (function () {
    var gate = document.querySelector("[data-under-build]");
    if (!gate) return;

    var KEY = "sentiora-look";
    // The password is not in this file. What is here is its SHA-256, which
    // cannot be turned back into the password -- so nobody reads it out of
    // view-source. It still only guards the curtain, not the content.
    var WANTED = "{{PAROLA_HASH}}";

    function hash(text) {
      var bytes = new TextEncoder().encode(text);
      return crypto.subtle.digest("SHA-256", bytes).then(function (buffer) {
        return Array.prototype.map.call(new Uint8Array(buffer), function (b) {
          return b.toString(16).padStart(2, "0");
        }).join("");
      });
    }

    try {
      if (sessionStorage.getItem(KEY) === WANTED) return;   // already let in
    } catch (e) { /* private browsing: just show the gate */ }

    gate.hidden = false;

    var form = gate.querySelector("[data-under-build-form]");
    var input = gate.querySelector("[data-under-build-input]");
    var said = gate.querySelector("[data-under-build-said]");
    input.focus();

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      hash(input.value).then(function (given) {
        if (given !== WANTED) {
          said.textContent = "That is not it.";
          input.select();
          return;
        }
        try { sessionStorage.setItem(KEY, WANTED); } catch (e) { /* fine */ }
        gate.remove();
      });
    });
  })();
</script>
